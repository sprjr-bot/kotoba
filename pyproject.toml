[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kotoba"
version = "0.1.0"
description = "Japanese and English dictionary TUI/CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
]

[project.scripts]
kotoba = "kotoba.cli:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kotoba"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: hits a live upstream API",
]
